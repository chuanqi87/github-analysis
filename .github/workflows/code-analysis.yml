name: code-analysis

# tier-3 深度分析：评估仓库鸿蒙化的可行性与路径，结果写入 Supabase（tier=3）。
#
# 两条路径，主次分明：
#   1. deepwiki-deep（主）—— 基于 DeepWiki 全量代码索引逐子系统问询 + 一次结构化定级。
#      免费、约 15s/仓，覆盖绝大多数高星仓库。
#   2. tarball-fallback（兜底）—— 只对 DeepWiki 未索引的仓库，下载源码用 Agent 实际阅读。
#      慢且烧 token，所以严格限定在主路径覆盖不到的仓库上。

on:
  workflow_dispatch:
    inputs:
      repos:
        description: '仓库列表（逗号分隔，如 facebook/react,vuejs/core）。留空则从 Supabase 取 top-N'
        required: false
        default: ''
      limit:
        description: '分析多少个仓库'
        required: false
        default: '30'
      skip_fallback:
        description: '跳过 tarball 兜底（只跑 DeepWiki 主路径）'
        required: false
        type: boolean
        default: false
      model:
        description: 'tarball 兜底使用的分析模型'
        required: false
        default: 'qwen3-max'
  schedule:
    - cron: '0 23 * * *'  # 每日 23:00 UTC 深度分析

concurrency:
  group: code-analysis
  cancel-in-progress: false

jobs:
  # ── 主路径：DeepWiki 深度问询 ────────────────────────────────────────────
  deepwiki-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DeepWiki deep analysis
        run: pnpm pipeline --stage=deepwiki-deep --limit=${{ github.event.inputs.limit || '30' }}

      - name: Summary
        if: always()
        run: |
          echo "## 🔎 tier-3 深度分析（DeepWiki 主路径）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "未被 DeepWiki 索引的仓库会在下一个 job 走 tarball 兜底。" >> $GITHUB_STEP_SUMMARY

  # ── 兜底：只处理 DeepWiki 未索引的仓库 ───────────────────────────────────
  tarball-fallback:
    needs: deepwiki-deep
    if: ${{ github.event.inputs.skip_fallback != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      CODE_ANALYSIS_MODEL: ${{ github.event.inputs.model || 'qwen3-max' }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/agent/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/agent/requirements.txt

      - name: Run tarball agent on DeepWiki-uncovered repos
        run: |
          if [ -n "${{ github.event.inputs.repos }}" ]; then
            # 手动指定仓库：不加 --not-indexed-only，按用户要求原样分析
            REPOS=$(echo "${{ github.event.inputs.repos }}" | tr ',' ' ')
            echo "🔍 分析指定仓库: $REPOS"
            python scripts/agent/run.py $REPOS -v --write-db -o analysis-results.json
          else
            echo "🔍 兜底：只分析 DeepWiki 未索引的仓库"
            python scripts/agent/run.py --from-db --not-indexed-only \
              --limit ${{ github.event.inputs.limit || '30' }} \
              -v --write-db -o analysis-results.json
          fi

      - name: Upload results artifact
        if: always() && hashFiles('analysis-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-analysis-results
          path: analysis-results.json
          retention-days: 30

      - name: Print summary
        if: always()
        run: |
          echo "## 📦 tier-3 兜底分析（tarball Agent）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f analysis-results.json ]; then
            python3 -c "
          import json
          with open('analysis-results.json') as f:
              results = json.load(f)
          print('| 仓库 | 鸿蒙化状态 | 可行性 | 工作量 | 分类 | 推荐路径 |')
          print('|------|-----------|--------|--------|------|---------|')
          for r in results:
              owner = r.get('owner', '?')
              name = r.get('name', '?')
              analysis = r.get('analysis', {})
              if 'error' in r:
                  print(f'| ❌ {owner}/{name} | 分析失败 | - | - | - | {r[\"error\"][:40]} |')
              else:
                  harmony = analysis.get('harmony_suggestion', '?')
                  feasibility = analysis.get('feasibility', '?')
                  effort = analysis.get('effort_estimate', '?')
                  category = analysis.get('category', '?')
                  approach = analysis.get('recommended_approach', '?')[:50]
                  print(f'| {owner}/{name} | {harmony} | {feasibility} | {effort} | {category} | {approach} |')
          " >> $GITHUB_STEP_SUMMARY || echo "结果解析失败" >> $GITHUB_STEP_SUMMARY
          else
            echo "无需兜底：DeepWiki 已覆盖全部候选仓库。" >> $GITHUB_STEP_SUMMARY
          fi
