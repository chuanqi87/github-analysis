name: analyze-full

# 仓库同步:每日抓取 Star>=10000 的仓库,与库中对比,新增仓库做初步分析(不含 LLM)。
# 手动触发可运行完整流程(含 LLM 深度分析)。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '仅处理 top N(留空=全量,MVP 建议 300-500)'
        required: false
        default: ''
      stage:
        description: '运行模式:sync(同步,无LLM)/all(全量,含LLM)/单阶段'
        required: false
        default: 'all'
  schedule:
    - cron: '0 21 * * *' # 每日 21:00 UTC 同步新仓库(初步分析)

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
      DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL || 'qwen-plus' }}
      DASHSCOPE_MODEL_DEEP: ${{ vars.DASHSCOPE_MODEL_DEEP || 'qwen-max' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pipeline
        run: |
          # 定时调度:只跑 sync(无 LLM),快速同步新仓库
          # 手动触发:按用户选择运行(all/sync/单阶段)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "⏰ 定时同步模式:获取 Star>=10000 新仓库 + 初步分析"
            pnpm pipeline --stage=sync
          else
            echo "🎛️ 手动触发:stage=${{ github.event.inputs.stage || 'all' }}"
            pnpm pipeline --stage=${{ github.event.inputs.stage || 'all' }} --limit=${{ github.event.inputs.limit }}
          fi
