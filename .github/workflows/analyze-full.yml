name: analyze-daily

# 每日分层分析:多源发现 → 大批初筛 → 高价值深评 → 代码级深析 → 每日指标。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '仅处理 top N(留空=全量,MVP 建议 300-500)'
        required: false
        default: ''
      stage:
        description: '运行模式:daily(推荐)/all/sync/单阶段'
        required: false
        default: 'daily'
      preliminary_limit:
        description: '每日初筛数量'
        required: false
        default: '400'
      deep_limit:
        description: '每日高价值深评数量'
        required: false
        default: '100'
      tier3_limit:
        description: '每日代码级深析数量'
        required: false
        default: '20'
  schedule:
    - cron: '0 21 * * *' # 每日 21:00 UTC 执行完整分层漏斗

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
      DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL || 'qwen-plus' }}
      DASHSCOPE_MODEL_DEEP: ${{ vars.DASHSCOPE_MODEL_DEEP || 'qwen-max' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run layered pipeline
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm pipeline --stage=daily --preliminary-limit=400 --deep-limit=100 --tier3-limit=20
          else
            pnpm pipeline --stage=${{ github.event.inputs.stage || 'daily' }} \
              --limit=${{ github.event.inputs.limit }} \
              --preliminary-limit=${{ github.event.inputs.preliminary_limit || '400' }} \
              --deep-limit=${{ github.event.inputs.deep_limit || '100' }} \
              --tier3-limit=${{ github.event.inputs.tier3_limit || '20' }}
          fi
