name: analyze-weekly-reconciliation

# 每周校准:再次采集多周期热点、刷新归档状态与全局评分。
on:
  schedule:
    - cron: '0 20 * * 1' # 每周一 20:00 UTC
  workflow_dispatch:

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
      DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL || 'qwen3.8-max' }}
      DASHSCOPE_REASONING_EFFORT: ${{ vars.DASHSCOPE_REASONING_EFFORT || 'xhigh' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh weekly trending evidence
        run: pnpm pipeline --stage=weekly-trending
      - name: Reconcile archived repositories
        run: pnpm pipeline --stage=mark-archived
      - name: Refresh global ranking
        run: pnpm pipeline --stage=score
