name: db-migrate

# 手动执行 supabase/migrations/*.sql。
# 刻意只保留 workflow_dispatch:迁移是对生产库的 DDL,不该跟着定时任务自动跑。
# 与 analyze 系列共用 concurrency group,先 dispatch 本 workflow 再 dispatch
# analyze-weekly 时,后者会排队等迁移跑完,保证「先建列再写列」的顺序。
on:
  workflow_dispatch:

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 二选一:直连 Postgres,或 Management API 令牌(见 scripts/db-migrate.ts)
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 校验迁移凭据
        run: |
          if [ -z "$SUPABASE_DB_URL" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::缺少迁移凭据。请在仓库 Secrets 里配置 SUPABASE_DB_URL(Settings → Database → Session pooler 连接串)或 SUPABASE_ACCESS_TOKEN(https://supabase.com/dashboard/account/tokens 生成的 sbp_ 令牌)其一。"
            exit 1
          fi

      - name: Run migrations
        run: pnpm db:migrate

      - name: 校验配置与连通性
        run: pnpm check
